# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Share clipboard between remote and host
set -g set-clipboard on

# Share theme into nvim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Use vi key bindings in copy mode
setw -g mode-keys vi

# Enable mappings like Ctrl+Tab...
set -s extended-keys on
set -s extended-keys-format csi-u   # tmux >= 3.5
set -as terminal-features 'xterm*:extkeys'

# Nvim?
set-option -g focus-events on

# Window numbering starts at 1
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# TMUX Plugin Manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'thesast/tmux-transient-status'

# Dotbar config
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-session-text "#S"
set -g @tmux-dotbar-rounded false
set -g @tmux-dotbar-window-status-format " #[fg=cyan]#[dim]#I#[none]#{?#{==:#{window_name},zsh},, #[fg=#665547]#W}#{?#{==:#{pane_current_path},#{HOME}},, #[fg=#475266]#{b:pane_current_path}} "

# Transient status config
set -g @transient-status-delay '0'
set -g @transient-status-stall '1.5'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Put this down here to stop the plugin overriding
set -g window-status-current-format " #[fg=white]#I#{?#{==:#{window_name},zsh},, #[fg=darkorange]#W}#{?#{==:#{pane_current_path},#{HOME}},, #[fg=cyan]#{b:pane_current_path}} "
